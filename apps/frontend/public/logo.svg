<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pp-g" x1="0" y1="200" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="200" height="200" rx="46" fill="#080C13"/>

  <!-- Subtle inner glow rim -->
  <rect x="2" y="2" width="196" height="196" rx="44" fill="none" stroke="url(#pp-g)" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Letter P: vertical stem -->
  <rect x="58" y="38" width="14" height="124" rx="7" fill="url(#pp-g)" filter="url(#glow)"/>

  <!-- Letter P: top horizontal bar -->
  <rect x="68" y="38" width="58" height="14" rx="7" fill="url(#pp-g)" filter="url(#glow)"/>

  <!-- Letter P: rounded bump arc (right side) — top half -->
  <path d="M 126 52 C 152 52 152 104 126 104" stroke="url(#pp-g)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Letter P: middle horizontal bar -->
  <rect x="68" y="97" width="58" height="14" rx="7" fill="url(#pp-g)" filter="url(#glow)"/>

  <!-- ECG pulse line across bottom half of card -->
  <path d="M 48 148 L 70 148 L 82 124 L 96 172 L 110 118 L 124 148 L 152 148"
        stroke="url(#pp-g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#glow)"/>

  <!-- Pulse dot at end of ECG line -->
  <circle cx="152" cy="148" r="5.5" fill="url(#pp-g)" filter="url(#glow)"/>
</svg>
